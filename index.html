<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ticket Dynamique</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Empêche la sélection de texte pour faire plus "application" */
            user-select: none; 
            -webkit-user-select: none;
        }
        .wrapper {
            position: relative;
            display: inline-block;
            max-width: 100vw;
            max-height: 100vh;
            container-type: inline-size;
        }
        img {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        .patch {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        /* Masques et superpositions */
        #patch-status-time {
            top: 1.2%; left: 3.5%; width: 14%; height: 3%;
            background-color: #f26428;
            color: #111;
            font-weight: 500;
            font-size: 3.8cqw;
            justify-content: flex-start;
            padding-left: 2%;
        }
        #patch-hourglass {
            top: 13.5%; left: 74.5%; width: 6%; height: 2.2%;
            background-color: #e4e6e6;
        }
        #patch-timer {
            top: 34%; left: 35%; width: 30%; height: 3.5%;
            background-color: #1a100b;
            color: #fff;
            font-weight: 700;
            font-size: 5.5cqw;
            letter-spacing: 0.5px;
        }
        #patch-date {
            top: 55.4%; left: 2%; width: 49%; height: 3.8%;
            background-color: #e0e0e0;
            color: #222;
            font-size: 3.8cqw;
            border-radius: 4px;
            justify-content: flex-start;
            padding-left: 2%;
        }
        #patch-validation-time {
            top: 61.2%; right: 4%; width: 14%; height: 3%;
            background-color: #fff;
            color: #000;
            font-weight: 700;
            font-size: 4.5cqw;
            justify-content: flex-end;
        }
        
        /* Animation du sablier : 0.5s de rotation, 0.5s de pause (1s au total) */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(180deg); }
        }
        .hourglass-svg {
            height: 100%;
            animation: spin 1s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <!-- Le clic n'importe où déclenche le mode plein écran -->
    <div class="wrapper">
        <img src="Screenshot_20261015_001123_Gallery.jpg" alt="Fond">
        
        <!-- Heure en haut à gauche -->
        <div id="patch-status-time" class="patch">
            <span id="val-status-time"></span>
        </div>
        
        <!-- Sablier animé -->
        <div id="patch-hourglass" class="patch">
            <svg class="hourglass-svg" viewBox="0 0 24 24" fill="none" stroke="#354868" stroke-linecap="round" stroke-linejoin="round">
                <!-- Flèche circulaire -->
                <path d="M12 2v3a7 7 0 1 1-7 7h3a4 4 0 1 0 4-4v3l-5-5 5-5z" stroke-width="1.2"></path>
                <!-- Forme centrale du sablier -->
                <path d="M10 9h4v3l-1.5 2 1.5 2v3h-4v-3l1.5-2-1.5-2v-3z" fill="#354868" stroke="none"></path>
            </svg>
        </div>
        
        <!-- Compte à rebours du ticket -->
        <div id="patch-timer" class="patch">
            <span id="val-timer">01:30:00</span>
        </div>
        
        <!-- Date du jour -->
        <div id="patch-date" class="patch">
            <span id="val-date"></span>
        </div>
        
        <!-- Heure de validation en bas à droite -->
        <div id="patch-validation-time" class="patch">
            <span id="val-validation-time"></span>
        </div>
    </div>

    <script>
        // --- 1. Gestion des dates et heures dynamiques ---
        function updateDateTime() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const timeStr = hh + ':' + mm;
            
            // Mise à jour de l'heure système et de l'heure de validation
            document.getElementById('val-status-time').textContent = timeStr;
            document.getElementById('val-validation-time').textContent = timeStr;
            
            // Mise à jour de la date (Format : Aujourd'hui - 16 octobre 2026)
            const months = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
            const dateStr = "Aujourd'hui - " + now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();
            document.getElementById('val-date').textContent = dateStr;
        }
        
        // Exécuter tout de suite, puis toutes les minutes
        updateDateTime();
        setInterval(updateDateTime, 60000);
        
        // --- 2. Gestion du compte à rebours (1h30) ---
        let timeLeft = 90 * 60; // 90 minutes en secondes
        const timerEl = document.getElementById('val-timer');
        
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
            }
            const h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
            const m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            timerEl.textContent = h + ':' + m + ':' + s;
        }, 1000);
        
        // --- 3. Mode plein écran ---
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Impossible de passer en plein écran :", err);
                });
            }
        });
    </script>
</body>
</html>
